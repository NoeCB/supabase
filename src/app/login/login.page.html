<ion-header>
  <ion-toolbar color="primary">
    <ion-title>DAM CRM - Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="stacked"
          type="email"
          autocomplete="email"
          formControlName="email"
          errorText="Introduce un email válido"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          errorText="Mínimo 6 caracteres"
        ></ion-input>
      </ion-item>
    </ion-list>

    @if (errorMsg()) {
      <ion-text color="danger" role="alert">
        <p>{{ errorMsg() }}</p>
      </ion-text>
    }

    <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </ion-button>
  </form>
</ion-content>
